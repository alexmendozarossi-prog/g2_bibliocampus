<article class="card book-card h-100">

    <div class="cover cv-1" [class.sold]="agotado()" role="img">
        <span class="cover-letter"> {{titulo.charAt(0)}} </span>
        <span class="cover-cat"> {{categoria}} </span>
    </div>

    <div class="card-body d-flex flex-column p-4">
        <h3 class="titulo mb-1">{{titulo}}</h3>
        <p class="small muted mb-3">{{autor.toUpperCase()}} - {{anio}} </p>
        <p class="mb-4">
            <span class="pill" [class.pill-ok]="!agotado()"
                  [class.pill-no]="agotado()" >
                {{etiqueta()}}
            </span>
        </p>

        <!-- <p> {{mostrarInfo()}} </p>  PROBANDO QUE LAS FUNCIONES Y METODOS FUNCIONEN
         INTERPOLACION- son las llaves    -->
        
        <!-- el PROPERTY BINDING son las que tienen los corchetes -->

        <button type="button" class="btn btn-primary w-100 mt-auto py-2"
                [disabled]="agotado()"
                (click)="alSolicitar()"
                >
                <!--SE CAMBIO EL TEXTO(solicitar prestamo) POR UNA INTERPOLACION
                    PARA QUE EL BOTON CAMBIE CUANDO LLEGUE A 0-->
                {{agotado() ? 'Sin Copias Disponibles' : 'Solicitar Prestamo'}}
        </button>
    </div>
    
</article>
